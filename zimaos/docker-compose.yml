# PenpotOS – import v ZimaOS beze změn. Po instalaci otevři http://<IP>:9002 a vytvoř admina.
name: penpotos

x-env: &env
  PENPOTOS_CONFIG_DIR: /config
  TZ: Europe/Prague
# Bez podmíněných depends_on: penpotos-core při startu zapíše hesla a startovací skripty
# do volume "config" a ostatní kontejnery si na ně samy počkají.

volumes: { config: {}, db: {}, assets: {}, discord: {} }

# Vlastní síť je nutná: bez ní ZimaOS dá kontejnery do výchozí sítě "bridge",
# kde se navzájem nenajdou podle jména (ENOTFOUND penpot-postgres).
networks:
  penpot:
    name: penpotos

services:
  penpotos-core:
    image: ghcr.io/jirkacepelka/penpotos-core:latest
    container_name: penpotos-core
    networks: [penpot]
    restart: unless-stopped
    ports: ["9001:8080", "9002:8081"]
    volumes: [config:/config]
    environment: *env

  penpotos-mcp:
    image: ghcr.io/jirkacepelka/penpotos-mcp:latest
    container_name: penpotos-mcp
    networks: [penpot]
    restart: unless-stopped
    init: true
    shm_size: 1gb
    volumes: [config:/config:ro]
    environment: *env

  penpotos-discord:
    image: ghcr.io/jirkacepelka/penpotos-discord:latest
    container_name: penpotos-discord
    networks: [penpot]
    restart: unless-stopped
    volumes: [config:/config:ro, discord:/data]
    environment: *env

  penpot-frontend:
    image: penpotapp/frontend:2.18
    container_name: penpot-frontend
    networks: [penpot]
    restart: unless-stopped
    volumes: [assets:/opt/data/assets]
    depends_on: [penpot-backend, penpot-exporter]
    environment:
      PENPOT_FLAGS: disable-registration enable-login-with-password disable-onboarding enable-plugins
      PENPOT_IPV6_LISTEN_DIRECTIVE: "#"
      PENPOT_HTTP_SERVER_MAX_BODY_SIZE: "367001600"
      PENPOT_HTTP_SERVER_MAX_MULTIPART_BODY_SIZE: "367001600"

  penpot-backend:
    image: penpotapp/backend:2.18
    container_name: penpot-backend
    networks: [penpot]
    restart: unless-stopped
    command: ["/bin/bash", "-c", "until [ -s /config/run-backend.sh ]; do sleep 2; done; exec bash /config/run-backend.sh"]
    volumes: [assets:/opt/data/assets, config:/config:ro]
    environment:
      PENPOT_FLAGS: disable-registration enable-login-with-password enable-prepl-server disable-email-verification enable-access-tokens disable-onboarding disable-secure-session-cookies
      PENPOT_PREPL_HOST: 0.0.0.0
      PENPOT_DATABASE_URI: postgresql://penpot-postgres/penpot
      PENPOT_DATABASE_USERNAME: penpot
      PENPOT_REDIS_URI: redis://penpot-valkey/0
      PENPOT_OBJECTS_STORAGE_BACKEND: fs
      PENPOT_OBJECTS_STORAGE_FS_DIRECTORY: /opt/data/assets
      PENPOT_TELEMETRY_ENABLED: "false"
      PENPOT_HTTP_SERVER_MAX_BODY_SIZE: "367001600"
      PENPOT_HTTP_SERVER_MAX_MULTIPART_BODY_SIZE: "367001600"

  penpot-exporter:
    image: penpotapp/exporter:2.18
    container_name: penpot-exporter
    networks: [penpot]
    restart: unless-stopped
    command: ["/bin/bash", "-c", "until [ -s /config/run-exporter.sh ]; do sleep 2; done; exec bash /config/run-exporter.sh"]
    volumes: [config:/config:ro]
    environment:
      PENPOT_PUBLIC_URI: http://penpot-frontend:8080
      PENPOT_INTERNAL_URI: http://penpot-frontend:8080
      PENPOT_REDIS_URI: redis://penpot-valkey/0

  penpot-postgres:
    image: postgres:15
    container_name: penpot-postgres
    networks: [penpot]
    restart: unless-stopped
    stop_signal: SIGINT
    command: ["bash", "-c", "until [ -s /config/postgres_password ]; do sleep 2; done; exec docker-entrypoint.sh postgres"]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U penpot"], interval: 2s, retries: 30 }
    volumes: [db:/var/lib/postgresql/data, config:/config:ro]
    environment:
      POSTGRES_DB: penpot
      POSTGRES_USER: penpot
      POSTGRES_PASSWORD_FILE: /config/postgres_password

  penpot-valkey:
    image: valkey/valkey:8.1
    container_name: penpot-valkey
    networks: [penpot]
    restart: unless-stopped

x-casaos:
  main: penpotos-core
  port_map: "9001"
  scheme: http
  index: /
  category: Design
  author: Libertariánská strana Voluntia
  title: { en_us: PenpotOS }
  tagline: { en_us: Penpot pro týmy, s AI }
  icon: https://raw.githubusercontent.com/penpot/penpot/develop/frontend/resources/images/favicon.png
